org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true

# App version (Ubuntu-style): number + codename.
# Bump VERSION_CODE for every store upload.
# VERSION_NAME is the numeric release (e.g. 1.0.0); CODENAME is the fun label.
REMARKABLE_VERSION_CODE=4
REMARKABLE_VERSION_NAME=1.0.3
REMARKABLE_VERSION_CODENAME=Quiet Peak
