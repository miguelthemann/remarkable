name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Avoid release loop from the version bump commit.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       github.actor != 'github-actions[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x gradlew scripts/ci-release.sh

      - name: Bump version + changelog
        id: bump
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p dist
          ./scripts/ci-release.sh dist
          cat dist/version.env >> "$GITHUB_OUTPUT"
          # Also expose for later steps via GITHUB_ENV
          cat dist/version.env >> "$GITHUB_ENV"

      - name: Read version (PR builds — no bump)
        id: version_pr
        if: github.event_name == 'pull_request'
        run: |
          code=$(grep -E '^REMARKABLE_VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '\r')
          name=$(grep -E '^REMARKABLE_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r')
          codename=$(grep -E '^REMARKABLE_VERSION_CODENAME=' gradle.properties | cut -d= -f2- | tr -d '\r')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "codename=$codename" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remarkable-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release assets
        if: github.event_name != 'pull_request' && env.name != ''
        run: |
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$apk" "dist/remarkable-${name}-debug.apk"
          cat > dist/latest.json <<EOF
          {
            "versionCode": ${code},
            "versionName": "${name}",
            "codename": "${codename}",
            "htmlUrl": "https://github.com/${{ github.repository }}/releases/tag/v${name}"
          }
          EOF

      - name: Publish versioned GitHub Release
        if: github.event_name != 'pull_request' && env.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.name }}
          name: ${{ env.name }} ${{ env.codename }}
          body_path: dist/CHANGELOG.md
          prerelease: false
          make_latest: true
          files: |
            dist/latest.json
            dist/remarkable-${{ env.name }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ci-latest channel
        if: github.event_name != 'pull_request' && env.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: ${{ env.name }} ${{ env.codename }}
          body_path: dist/CHANGELOG.md
          prerelease: true
          make_latest: false
          files: |
            dist/latest.json
            dist/remarkable-${{ env.name }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        if: github.event_name != 'pull_request' && env.name != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore(release): ${name} ${codename} [skip ci]"
          git push
