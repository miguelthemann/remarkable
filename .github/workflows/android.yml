name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       github.actor != 'github-actions[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x gradlew scripts/ci-release.sh

      - name: Prepare release metadata
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p dist
          ./scripts/ci-release.sh prepare dist
          cat dist/version.env >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          REMARKABLE_KEYSTORE_BASE64: ${{ secrets.REMARKABLE_KEYSTORE_BASE64 }}
          REMARKABLE_STORE_PASSWORD: ${{ secrets.REMARKABLE_STORE_PASSWORD }}
          REMARKABLE_KEY_ALIAS: ${{ secrets.REMARKABLE_KEY_ALIAS }}
          REMARKABLE_KEY_PASSWORD: ${{ secrets.REMARKABLE_KEY_PASSWORD }}
          REMARKABLE_STORE_TYPE: ${{ secrets.REMARKABLE_STORE_TYPE }}
        run: |
          if [ -z "$REMARKABLE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing signing secrets. Add REMARKABLE_KEYSTORE_BASE64, REMARKABLE_STORE_PASSWORD, REMARKABLE_KEY_ALIAS, REMARKABLE_KEY_PASSWORD (optional REMARKABLE_STORE_TYPE) in repo Settings → Secrets."
            exit 1
          fi
          echo "$REMARKABLE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/remarkable-upload.jks"
          echo "REMARKABLE_STORE_FILE=$RUNNER_TEMP/remarkable-upload.jks" >> "$GITHUB_ENV"
          echo "REMARKABLE_STORE_PASSWORD=$REMARKABLE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "REMARKABLE_KEY_ALIAS=$REMARKABLE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "REMARKABLE_KEY_PASSWORD=$REMARKABLE_KEY_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$REMARKABLE_STORE_TYPE" ]; then
            echo "REMARKABLE_STORE_TYPE=$REMARKABLE_STORE_TYPE" >> "$GITHUB_ENV"
          fi

      - name: Assemble debug + release
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble debug + release (signed)
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          REMARKABLE_STORE_FILE: ${{ env.REMARKABLE_STORE_FILE }}
          REMARKABLE_STORE_PASSWORD: ${{ env.REMARKABLE_STORE_PASSWORD }}
          REMARKABLE_KEY_ALIAS: ${{ env.REMARKABLE_KEY_ALIAS }}
          REMARKABLE_KEY_PASSWORD: ${{ env.REMARKABLE_KEY_PASSWORD }}
          REMARKABLE_STORE_TYPE: ${{ env.REMARKABLE_STORE_TYPE }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remarkable-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare release assets
        if: github.event_name != 'pull_request' && env.should_release == 'true'
        run: |
          mkdir -p dist
          debug_apk=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          release_apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$debug_apk" "dist/remarkable-${name}-debug.apk"
          cp "$release_apk" "dist/remarkable-${name}-release.apk"
          cat > dist/latest.json <<EOF
          {
            "versionCode": ${code},
            "versionName": "${name}",
            "codename": "${codename}",
            "htmlUrl": "https://github.com/${{ github.repository }}/releases/tag/v${name}"
          }
          EOF

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && env.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.name }}
          name: ${{ env.name }} ${{ env.codename }}
          body_path: dist/CHANGELOG.md
          prerelease: false
          make_latest: true
          files: |
            dist/latest.json
            dist/remarkable-${{ env.name }}-debug.apk
            dist/remarkable-${{ env.name }}-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version for next release
        if: github.event_name != 'pull_request' && env.should_release == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          ./scripts/ci-release.sh bump-next
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          next_name=$(grep -E '^REMARKABLE_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r')
          next_codename=$(grep -E '^REMARKABLE_VERSION_CODENAME=' gradle.properties | cut -d= -f2- | tr -d '\r')
          git commit -m "chore(release): next is ${next_name} ${next_codename} [skip ci]"
          git push
